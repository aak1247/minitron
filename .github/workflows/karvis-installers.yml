name: Karvis native installers

on:
  workflow_dispatch:
    inputs:
      snapshot_release:
        description: Draft release containing an encrypted Karvis build snapshot
        required: true
      snapshot_asset:
        description: Encrypted snapshot asset name
        default: karvis-source.enc
        required: true

permissions:
  contents: read

jobs:
  installers:
    # Draft release assets are visible only to a token with repository write access.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/electron-builder/package-lock.json
      - name: Linux build, package and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libgtk-3-dev libnss3 libnotify4 libasound2 libgbm1 xvfb dbus-x11 rpm desktop-file-utils
      - name: Set up Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt
          rustup default 1.92.0
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
          key: release-${{ matrix.platform }}-rust-1.92-${{ hashFiles('shell/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-${{ matrix.platform }}-rust-1.92-
      - name: Build and test native launcher and adapter
        run: |
          npm --prefix packages/electron-builder ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/electron-builder test
          node --test scripts/karvis-snapshot.test.mjs
          cargo fmt --manifest-path shell/Cargo.toml --all -- --check
          cargo test --manifest-path shell/Cargo.toml --locked
          cargo build --manifest-path shell/Cargo.toml --locked --release
      - name: Retrieve encrypted Karvis build inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_RELEASE: ${{ inputs.snapshot_release }}
          SNAPSHOT_ASSET: ${{ inputs.snapshot_asset }}
          MINITRON_KARVIS_SNAPSHOT_KEY: ${{ secrets.MINITRON_KARVIS_SNAPSHOT_KEY }}
        run: |
          mkdir -p dist/karvis-input
          gh release download "$SNAPSHOT_RELEASE" --pattern "$SNAPSHOT_ASSET" --dir dist/karvis-input
          node scripts/karvis-snapshot.mjs extract --input "dist/karvis-input/$SNAPSHOT_ASSET" --out dist/karvis-source
      - name: Prepare native Karvis dependencies and verified Electron 28
        run: |
          npm --prefix dist/karvis-source ci --no-audit --no-fund
          node scripts/download-e2e-runtimes.mjs dist/electron-zips 28.3.3
      - name: Linux DEB and RPM lifecycle
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a node scripts/e2e-karvis-unix.mjs --project "$PWD/dist/karvis-source" --launcher "$PWD/shell/target/release/minitron" --runtime-zip "$PWD/dist/electron-zips/electron-v28.3.3-linux-x64.zip" --report "$PWD/dist/karvis-installers-report.json"
      - name: macOS DMG and PKG lifecycle
        if: runner.os == 'macOS'
        run: |
          node scripts/e2e-karvis-unix.mjs --project "$PWD/dist/karvis-source" --launcher "$PWD/shell/target/release/minitron" --runtime-zip "$PWD/dist/electron-zips/electron-v28.3.3-darwin-$(node -p process.arch).zip" --report "$PWD/dist/karvis-installers-report.json"
      - name: Save lifecycle report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: karvis-installers-${{ matrix.platform }}
          path: dist/karvis-installers-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save Rust cache
        if: ${{ always() && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
          key: release-${{ matrix.platform }}-rust-1.92-${{ hashFiles('shell/Cargo.lock') }}-${{ github.sha }}
