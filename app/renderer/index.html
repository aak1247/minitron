<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>MyApp</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
    dt { font-weight: 600; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>MyApp — 运行在共享 Electron Runtime 上</h1>
  <p>本页由共享 Electron Runtime 通过应用归档路径加载。</p>
  <dl id="info"></dl>
  <script>
    window.myapp.info().then((i) => {
      const info = document.getElementById("info");
      for (const [key, value] of Object.entries(i)) {
        const term = document.createElement("dt");
        const description = document.createElement("dd");
        const code = document.createElement("code");
        term.textContent = key;
        code.textContent = String(value);
        description.append(code);
        info.append(term, description);
      }
      document.body.dataset.ready = "true";
      if (window.myapp.readinessEnabled) return window.myapp.reportReady();
    }).catch((error) => {
      document.body.dataset.error = String(error);
      return window.myapp.reportError(error);
    });
  </script>
</body>
</html>
